<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;font-family:Roboto,Inter,sans-serif;color:#3A2118;overflow:hidden;
background:linear-gradient(160deg,#FFF6EC 0%,#FFE7D1 100%);position:relative}
.wrap{position:absolute;left:60px;top:60px;right:60px;bottom:60px}
.left{position:absolute;left:0;top:0;width:470px}
.logo{width:150px;height:150px;border-radius:34px;box-shadow:0 10px 28px rgba(228,80,58,.28)}
h1{font-size:84px;font-weight:800;letter-spacing:-2px;margin-top:22px;line-height:1}
.tag{font-size:33px;font-weight:600;margin-top:20px;line-height:1.25}
.tag b{color:#E4503A;font-weight:700}
.card{position:absolute;left:520px;top:0;width:560px;height:360px;background:#fff;border-radius:28px;
box-shadow:0 8px 26px rgba(120,60,20,.14);padding:14px 30px;display:flex;flex-direction:column;justify-content:space-between}
.row{display:flex;align-items:center;gap:20px;font-size:27px;font-weight:600;height:80px}
.row+.row{border-top:2px solid #F6E7D8}
.dot{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#FF8A3D,#E4503A);color:#fff;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center}
.bar{position:absolute;left:0;right:0;bottom:0;height:96px;border-radius:24px;background:linear-gradient(90deg,#FF8A3D,#E4503A);
display:flex;align-items:center;justify-content:space-between;padding:0 36px;color:#fff;box-shadow:0 8px 22px rgba(228,80,58,.3)}
.bar .a{font-size:34px;font-weight:800}
.bar .b{font-size:26px;font-weight:500;opacity:.97}
.bar .b strong{font-weight:800}
</style></head><body><div class="wrap">
<div class="left"><img class="logo" src="icon.png"><h1>Kitchen OS</h1>
<div class="tag"><b>What are we eating tonight?</b> Answered in seconds.</div></div>
<div class="card">
<div class="row"><div class="dot">✓</div>Snap your fridge and pantry</div>
<div class="row"><div class="dot">✓</div>Picks dinner from what you have</div>
<div class="row"><div class="dot">✓</div>Checks everyone's allergies</div>
<div class="row"><div class="dot">✓</div>Shopping list you can text yourself</div>
</div>
<div class="bar"><div class="a">Free - add it to your home screen</div><div class="b">Created by <strong>Mellow</strong></div></div>
</div></body></html>
